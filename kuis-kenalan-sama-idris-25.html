<title>Kenalan Sama Idris 🤝</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:18px;
background:radial-gradient(circle at 15% 15%,#6553a6 0,transparent 30%),radial-gradient(circle at 85% 80%,#2d8c8c 0,transparent 30%),linear-gradient(135deg,#11131f,#25203b 55%,#111923);position:relative;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#ffffff18 1px,transparent 1px);background-size:24px 24px}
.app{width:100%;max-width:560px;background:#171925eF;border:1px solid #ffffff20;border-radius:30px;padding:24px;box-shadow:0 22px 70px #0009;backdrop-filter:blur(12px)}
h1{font-size:28px;margin:0 0 8px;text-align:center}.intro{text-align:center;line-height:1.6;color:#ddd}.line{border-top:1px dashed #777;margin:18px 0}
input{width:100%;padding:15px;border:1px solid #ffffff18;border-radius:14px;background:#2b2d3c;color:white;font-size:16px;outline:none}
input:focus{border-color:#aaa}
button{border:0;border-radius:15px;padding:14px 18px;font-size:16px;font-weight:700;cursor:pointer;width:100%;margin-top:12px;background:#f1f1f1;color:#20202b}
button:hover{transform:translateY(-1px)}
.qtop{display:flex;justify-content:space-between;color:#bbb;font-size:14px}.question{font-size:23px;font-weight:800;text-align:center;margin:20px 0}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.choice{background:#292b39;color:white;border:2px solid transparent;padding:10px;min-height:190px;overflow:hidden}
.choice img{width:100%;height:125px;object-fit:cover;border-radius:12px;display:block;margin-bottom:10px}
.choice .emoji{height:125px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#3b3d50,#222433);font-size:55px;margin-bottom:10px}
.choice.correct{border-color:#52d273;background:#21492d}.choice.wrong{border-color:#ef6262;background:#54272b}
.choice:disabled{cursor:default;opacity:1}
.score{text-align:center;font-size:52px;font-weight:900;margin:15px 0}.result{text-align:center;line-height:1.6}.small{color:#bbb;font-size:14px}
.hidden{display:none!important}
@media(max-width:380px){.app{padding:18px}.choices{grid-template-columns:1fr}.question{font-size:20px}}
</style>
</head>

</section>

<section id="quiz" class="hidden">
<div class="qtop"><span id="counter"></span><span id="player"></span></div>

</section>

<section id="result" class="hidden">
<h1>🏆 HASIL KUIS</h1>
<div class="score" id="score"></div>
<div class="result" id="message"></div>
<button id="again">🔄 COBA LAGI</button>

</section>
</div>

let name="",index=0,score=0;

const $=id=>document.getElementById(id);
$("startBtn").onclick=()=>{
 name=$("name").value.trim()||"Anonim";
 index=0;score=0;
 $("start").classList.add("hidden");$("result").classList.add("hidden");$("quiz").classList.remove("hidden");
 render();
};
function render(){
 const item=questions[index];
 $("counter").textContent=`Soal ${index+1}/${questions.length}`;
 $("player").textContent=name;
 $("question").textContent=item.q;
 $("choices").innerHTML="";
 item.a.forEach((x)=>{
  const b=document.createElement("button");b.className="choice";
  b.innerHTML=`<img src="${x[0]}" alt="${x[1]}"><b>${x[1]}</b>`;
  b.onclick=()=>answer(b,x[2]);
  $("choices").appendChild(b);
 });
}
function answer(btn,correct){
 [...$("choices").children].forEach(b=>b.disabled=true);
 if(correct){score++;btn.classList.add("correct")}else btn.classList.add("wrong");
 setTimeout(()=>{
  index++;
  if(index<questions.length)render();else finish();
 },500);
}
function finish(){
 $("quiz").classList.add("hidden");$("result").classList.remove("hidden");
 $("score").textContent=`${score}/${questions.length}`;
 let msg="";
 if(score>=9)msg=`🔥 <b>GILA, ${name} KENAL BANGET!</b><br>Kayaknya kamu terlalu sering memperhatikan Idris 🗿😭`;
 else if(score>=7)msg=`😎 <b>LUMAYAN KENAL!</b><br>Masih ada beberapa rahasia Idris yang belum kamu bongkar.`;
 else if(score>=4)msg=`😭 <b>KENAL SIH...</b><br>Tapi kayaknya cuma kenal nama.`;
 else msg=`🗿 <b>KAMU YAKIN KITA PERNAH KENALAN?</b><br>Silakan kenalan ulang dari awal 😂`;
 msg+=`<br><br>🤝 Terima kasih sudah berkenalan sama Idris!<br>Kalau nilaimu kecil, tenang... <b>Idris juga belum tentu kenal dirinya sendiri.</b> 😂<br><br>Risiko pertemanan ditanggung masing-masing 🗿`;
 $("message").innerHTML=msg;
}
$("again").onclick=()=>{
 $("result").classList.add("hidden");$("start").classList.remove("hidden");$("name").value=name;
};
$("share").onclick=async()=>{
 const text=`Aku baru selesai kuis "Kenalan Sama Idris"! 🤝\\nNama: ${name}\\nNilai: ${score}/${questions.length} 🗿`;
 if(navigator.share){try{await navigator.share({title:"Kenalan Sama Idris",text})}catch(e){}}
 else{alert(text+"\\n\\nSalin teks ini dan kirim ke temanmu!")}
};
</script>
